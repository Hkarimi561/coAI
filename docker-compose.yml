name: devops-ai

x-backend-env: &backend-env
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    SEARXNG_URL: http://searxng:8080
    DOCKER_HOST: http://docker-proxy:2375
    DOCS_DIR: /data/docs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops}
      POSTGRES_DB: ${POSTGRES_DB:-devops_ai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333" # dashboard / debugging only, bound to localhost

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/

  # Read-only Docker API: only GET /containers/* is allowed (POST=0 blocks start/stop/exec/restart).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      # Container start/stop/restart from the Containers page. Off by default; set DOCKER_PROXY_ALLOW_ACTIONS=1 in .env to enable.
      ALLOW_START: ${DOCKER_PROXY_ALLOW_ACTIONS:-0}
      ALLOW_STOP: ${DOCKER_PROXY_ALLOW_ACTIONS:-0}
      ALLOW_RESTARTS: ${DOCKER_PROXY_ALLOW_ACTIONS:-0}
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      INFO: 0
      EXEC: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      EVENTS: 0
      NODES: 0
      PLUGINS: 0
      SESSION: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backend:
    build:
      context: ./backend
      args:
        INSTALL_LOCAL_EMBEDDINGS: ${INSTALL_LOCAL_EMBEDDINGS:-true}
        APP_UID: ${APP_UID:-1000}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach an Ollama running on the Docker host
    volumes:
      - ./docs:/data/docs
      - hf_cache:/data/hf
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Sample MCP server with read-only DevOps checks. Add http://sample-mcp:9100/mcp in Admin -> MCP servers.
  # Reuses the backend image (it already has the `mcp` package); remove this service if you do not need it.
  sample-mcp:
    image: devops-ai-backend
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - backend
    entrypoint: ["python", "/samples/devops_tools.py"]
    volumes:
      - ./mcp-samples:/samples:ro

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  hf_cache:
